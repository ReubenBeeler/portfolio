name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy-on-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter web
        # --pwa-strategy=none: coi-serviceworker owns scope '/', so Flutter's own
        # service worker can never install. Shipping it anyway made flutter.js wait
        # out its full 4s timeout before downloading the renderer, and blocked
        # cross-origin isolation from ever being established.
        run: flutter build web --release --wasm --pwa-strategy=none

      - name: Copy CNAME
        run: cp CNAME build/web/
      
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          destination_dir: ""
          force_orphan: true