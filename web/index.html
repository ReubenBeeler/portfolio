<!DOCTYPE html><html><head>
  <!--
    One-time cleanup for visitors carrying the old Flutter service worker.

    This site used to ship both coi-serviceworker.js and Flutter's own
    flutter_service_worker.js, both claiming scope '/'. Only one can control the
    page. Anyone who visited before that was fixed still has the Flutter worker
    installed, and it is cache-first, so they keep being served the OLD build:
    the old bootstrap (which stalls 4s waiting on its own worker), no
    cross-origin isolation, and therefore the dart2js fallback instead of wasm.
    It does not heal on its own, because the stale worker answers the requests
    that would have replaced it.

    So: unregister it, drop its caches, reload once. No-op for everyone else.
  -->

  (function () {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) return;
    var FLAG = 'staleSwCleaned';
    if (sessionStorage.getItem(FLAG)) return;
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      // Check every slot, not just the first non-null one: the stale worker can
      // sit in `waiting` while coi-serviceworker holds `active`, and vice versa.
      var stale = regs.filter(function (reg) {
        return [reg.active, reg.waiting, reg.installing].some(function (w) {
          return w && w.scriptURL && w.scriptURL.indexOf('flutter_service_worker.js') !== -1;
        });
      });
      if (!stale.length) return;
      console.log('Removing a stale Flutter service worker and reloading once.');
      sessionStorage.setItem(FLAG, '1');
      return Promise.all(stale.map(function (reg) { return reg.unregister(); }))
        .then(function () { return window.caches ? caches.keys() : []; })
        .then(function (keys) {
          return Promise.all(keys.filter(function (k) { return /flutter/i.test(k); })
                                 .map(function (k) { return caches.delete(k); }));
        })
        .then(function () { location.reload(); });
    }).catch(function () { /* never block a boot on cleanup */ });
  })();
  </script>

    loading screen could not paint until this round trip finished. Down here it
    still runs long before anything needs SharedArrayBuffer, and on the second
    document it is a cache hit.
  -->
  <script src="coi-serviceworker.js"></script>
  <script id="boot-splash-script">
  (function () {
    var el = document.getElementById('boot-splash');
    if (!el) return;
    var spans = el.getElementsByTagName('span');
    var reduced = false;
    try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var TOTAL = reduced ? 0 : 1300;
    var KEY = 'bootSplashStart';
    var phase = function (name) { try { if (window.__bootPhase) window.__bootPhase(name); } catch (e) {} };
    var read = function () { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } };
    var write = function (v) { try { sessionStorage.setItem(KEY, v); } catch (e) {} };
    var clear = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} };

    var started = false, flyInDone = false, wantOut = false, leaving = false;

    function setDelays(offset) {
      for (var i = 0; i < spans.length; i++) {
        spans[i].style.animationDelay = (parseFloat(spans[i].getAttribute('data-delay')) - offset) + 'ms';
      }
    }

    function start() {
      if (started) return;
      started = true;

      // coi-serviceworker reloads the document once, to get the headers that
      // make SharedArrayBuffer (and therefore the threaded renderer) available.
      // Pick the animation up where the previous document left it instead of
      // replaying it, so the reload is invisible.
      var prior = parseFloat(read() || '0') || 0;
      var elapsed = prior > 0 ? Date.now() - prior : 0;
      if (prior <= 0 || elapsed < 0) { write(String(Date.now())); elapsed = 0; }

      if (elapsed >= TOTAL) {
        flyInDone = true;
        el.classList.add('parked');
        phase('WAITING');
        return flyOut();
      }
      phase('FLY_IN');
      setDelays(elapsed);
      el.classList.add('in');
      setTimeout(function () {
        flyInDone = true;
        phase('WAITING');
        flyOut();
      }, TOTAL - elapsed);
    }

    function flyOut() {
      if (leaving || !wantOut || !flyInDone) return;
      leaving = true;
      phase('FLY_OUT');
      setDelays(0);
      el.classList.remove('in');
      el.classList.remove('parked');
      el.classList.add('out');

        phase('flag:splashRemoved');

        // backdrop, so removing this is invisible; Dart fades from there.
        try { if (window.__splashDone) window.__splashDone(); } catch (e) {}

    window.__splashFlyOut = function () { wantOut = true; flyOut(); };

    // it is long enough that a cold load usually has the font by then (so the
    // letters never swap face mid-flight) and still far shorter than the black
    // screen this splash exists to replace. Subsetting the font to the eight
    // glyphs of "Loading..." would remove the trade-off entirely.
    if (document.fonts && document.fonts.load) {
